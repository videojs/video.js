buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// The daemon JVM criteria in gradle/gradle-daemon-jvm.properties are generated
// by `./gradlew updateDaemonJvm`. Pin the version only since this project installs JVMs via mise
tasks.named("updateDaemonJvm") {
    languageVersion = JavaLanguageVersion.of(17)
    toolchainDownloadUrls = [:]
}
