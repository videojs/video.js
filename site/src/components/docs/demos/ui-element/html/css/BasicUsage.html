<video-player class="html-ui-element-basic">
  <media-container class="html-ui-element-basic__container">
    <video src="{{VJS10_DEMO_VIDEO_MP4}}" autoplay muted playsinline loop></video>
    <div class="html-ui-element-basic__controls">
      <demo-seek-by seconds="-10">
        <button type="button" class="html-ui-element-basic__button"></button>
      </demo-seek-by>
      <demo-seek-by seconds="10">
        <button type="button" class="html-ui-element-basic__button"></button>
      </demo-seek-by>
    </div>
  </media-container>
</video-player>
