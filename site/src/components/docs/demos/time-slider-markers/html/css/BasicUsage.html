<video-player class="html-time-slider-markers-basic">
  <media-container class="html-time-slider-markers-basic__container">
    <video src="{{VJS10_DEMO_VIDEO_MP4}}" autoplay muted playsinline loop></video>
    <media-time-slider class="html-time-slider-markers-basic__slider">
      <media-slider-track class="html-time-slider-markers-basic__track">
        <media-slider-fill class="html-time-slider-markers-basic__fill"></media-slider-fill>
      </media-slider-track>
      <media-time-slider-markers label="ads" class="html-time-slider-markers-basic__markers">
        <template>
          <div class="html-time-slider-markers-basic__marker"></div>
        </template>
      </media-time-slider-markers>
      <media-slider-thumb class="html-time-slider-markers-basic__thumb"></media-slider-thumb>
    </media-time-slider>
  </media-container>
</video-player>
