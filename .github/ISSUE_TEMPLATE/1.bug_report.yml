name: 🐛 Bug Report
description: Report a reproducible bug or regression.
type: bug
labels: [triage]
title: 'Bug: '
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill this template out as completely as possible.
        * If you are not reporting a bug, but want to ask a general question, use [discussions](https://github.com/videojs/video.js/discussions) instead.
        * Check the [docs](https://videojs.org/docs).
        * Please check to see if there's an existing issue and replying there instead.
        * Please give as much details as you can. Ideally, include a [minimal, reproducible example](https://stackoverflow.com/help/minimal-reproducible-example)

        **Using Video.js 8?** File v8 issues in [videojs/videojs-v8](https://github.com/videojs/videojs-v8/issues/new/choose). It gets security fixes and a best effort on bug fixes until October 1, 2028. See the [migration guide](https://videojs.org/docs/framework/html/guides/migrate-from-video-js-8) to move to Video.js 10.

        **Security vulnerabilities:** don't file them here. [Report them privately](https://github.com/videojs/video.js/security/advisories/new).
  - type: checkboxes
    attributes:
      label: Is there an existing issue for this?
      description: Please search to see if an issue already exists for the bug you encountered.
      options:
        - label: I have searched the existing issues
          required: true
  - type: dropdown
    id: major-version
    validations:
      required: true
    attributes:
      label: Which major version of Video.js are you using?
      options:
        - Video.js 10 (@videojs/*)
        - Video.js 8 (video.js@8)
  - type: dropdown
    id: affected
    validations:
      required: true
    attributes:
      label: Which package(s) or projects are affected?
      multiple: true
      description: Note you can select more than one.
      options:
        - Core (@videojs/core)
        - Icons (@videojs/icons)
        - HTML (@videojs/html)
        - Media (@videojs/media)
        - React (@videojs/react)
        - SPF (@videojs/spf)
        - Utils (@videojs/utils)
        - HTML Example
        - React Example
        - Next.js Example
        - Website
        - Other (please mention in description)
  - type: textarea
    id: environment
    validations:
      required: true
    attributes:
      label: Browser/OS/Node environment
      description: |
        Please list which browser(s) and operating system(s) combination(s) you are using, and/or if this bug affects a command-line tool, please list your Node and npm versions.
      placeholder: |
        Browser: Chrome 103.0.5060.53
        OS: macOS 12.4
        Node version: 16.15.0
        npm version: 8.11.0
  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Please provide a clear and concise description of what the bug is. Include
        screenshots if needed. Please test using the latest version of the relevant
        Mux Elements packages to make sure your issue has not already been fixed.
    validations:
      required: true
  - type: input
    id: testcase
    attributes:
      label: Reduced test case
      description: |
        Please add a URL to a [reminimal reproducible example](https://stackoverflow.com/help/minimal-reproducible-example).
        This can be a codesandbox, a GitHub repo, or similar.
        Providing makes it easier to reproduce the issue and getting it fixed.
      placeholder: https://
  - type: textarea
    id: str
    attributes:
      label: Steps to reproduce
      description: |
        Detailed steps to reproduce the issue.
        Your bug will get fixed much faster if we can run your code and it's clear how to reproduce the issue.
        Issues without reproduction steps or code examples may be immediately closed as not actionable.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: actualbehavior
    attributes:
      label: Current Behavior
    validations:
      required: true
  - type: textarea
    id: expectedbehavior
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Errors
      description: If you see any errors in the console, please include them there
  - type: input
    id: version
    attributes:
      label: What version of the package are you using?
      description: Please include the version you are using. If you are not using the latest version, please explain why in the description above.
      placeholder: vX.Y.Z
